name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/test_contentgraph.py
      - run: python3 -m py_compile bridge/contentgraph.py
