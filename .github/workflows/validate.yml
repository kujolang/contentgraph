name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic-graph:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout Kujo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kujolang/kujo
          ref: v1.0.1
          path: kujo-runtime
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
      - name: Cache Kujo build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        with:
          workspaces: kujo-runtime
          cache-on-failure: true
      - name: Configure OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $opensslRoot = Split-Path (Split-Path (Get-Command openssl).Source)
          "OPENSSL_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_LIB_DIR=$opensslRoot\lib\VC\x64\MD" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build Kujo
        run: cargo build --locked --manifest-path kujo-runtime/Cargo.toml
      - name: Validate native ContentGraph
        shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/kujo-runtime/target/debug/kujo${{ runner.os == 'Windows' && '.exe' || '' }}
          CONTENTGRAPH_WINDOWS_LAUNCHER: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: bash scripts/validate.sh
      - name: Validate Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        env:
          KUJO_BIN: ${{ github.workspace }}\kujo-runtime\target\debug\kujo.exe
        run: contentgraph.cmd doctor --json
