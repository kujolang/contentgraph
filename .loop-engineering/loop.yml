objective: "Complete every item and exit criterion in docs/next-session-review.md for ContentGraph 0.2.0."
checklist_file: "docs/next-session-review.md"
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: validation
    command: "bash scripts/validate.sh"
    required: true

  - id: benchmark
    command: "./contentgraph-benchmark --nodes 1000"
    required: true

  - id: release_bundle
    command: "../kujo/target/release/kujo run scripts/package-release.kujo"
    required: true

  - id: diff_check
    command: "bash scripts/diff-check.sh"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
