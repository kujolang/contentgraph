schema = "contentgraph.config/v1"

[build]
source = ["fixtures/source"]
out = ".contentgraph/example"
min_similarity = 0.12
cluster_threshold = 0.20
overlap_threshold = 0.55
max_nodes = 5000
max_input_bytes = 536870912
max_output_bytes = 268435456
max_report_tokens = 2000
max_candidate_pairs = 2000000
max_related_per_node = 20
max_term_document_frequency_ratio = 1.0
max_analysis_items = 1000
deterministic = true
